services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ricemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ricemap_prod}
      POSTGRES_DB: ${POSTGRES_DB:-ricemap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO exponer puerto al host en producción
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ricemap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ricemap}:${POSTGRES_PASSWORD:-ricemap_prod}@db:5432/${POSTGRES_DB:-ricemap}
      - SECRET_KEY=${SECRET_KEY}
      - SENTINEL_CLIENT_ID=${SENTINEL_CLIENT_ID}
      - SENTINEL_CLIENT_SECRET=${SENTINEL_CLIENT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ENVIRONMENT=production
      - SQL_LOG_LEVEL=WARNING
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
